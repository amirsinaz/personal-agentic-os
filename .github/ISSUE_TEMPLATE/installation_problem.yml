name: Installation problem
description: Report a setup or dashboard problem without sharing private data.
title: "[Install]: "
labels: [installation]
body:
  - type: markdown
    attributes:
      value: "Do not paste credentials, full file paths, Vault contents, prompts, transcripts, project names, or private usage data. Redact personal details from logs and screenshots."
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations: { required: true }
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Codex, Claude Code, Gemini CLI, Other]
    validations: { required: true }
  - type: dropdown
    id: mode
    attributes:
      label: Installation mode
      options: [Full, Dashboard-only, Not sure]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps and sanitized error text.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What did you expect? }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, full paths, project names, Vault content, prompts, transcripts, and private usage data.
          required: true
